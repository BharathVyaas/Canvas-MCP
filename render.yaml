services:
  - type: web
    name: canvas-mcp-relay
    runtime: node
    plan: starter
    buildCommand: npm install --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: RELAY_TOKEN
        generateValue: true
      - key: MCP_PUBLIC
        value: false
      - key: BRIDGE_REQUEST_TIMEOUT_MS
        value: 120000
